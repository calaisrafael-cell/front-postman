<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eNotas — Inutilização NF-e</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#f0f2f5;color:#333}
header{background:#1a56db;color:#fff;padding:16px 24px}
header h1{font-size:1.2rem;font-weight:600}
.container{max-width:700px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.1);padding:20px;margin-bottom:20px}
.card h2{font-size:1rem;font-weight:600;margin-bottom:14px;color:#1a56db;border-bottom:2px solid #e8f0fe;padding-bottom:8px}
label{display:block;font-size:.82rem;font-weight:600;margin-bottom:4px;color:#555}
input,select{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:.88rem;margin-bottom:12px}
input:focus,select:focus{outline:none;border-color:#1a56db}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.btn{padding:9px 20px;border:none;border-radius:6px;cursor:pointer;font-size:.88rem;font-weight:600}
.btn-primary{background:#1a56db;color:#fff}
.btn-danger{background:#e02424;color:#fff}
.btn-secondary{background:#6b7280;color:#fff}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700;margin-right:6px}
.badge-get{background:#dbeafe;color:#1e40af}
.badge-post{background:#d1fae5;color:#065f46}
.alert{padding:10px 14px;border-radius:6px;font-size:.85rem;margin-bottom:12px;background:#fef3c7;color:#92400e;border-left:4px solid #f59e0b}
.response-box{background:#1e1e2e;color:#cdd6f4;border-radius:8px;padding:16px;font-family:monospace;font-size:.8rem;white-space:pre-wrap;word-break:break-all;max-height:350px;overflow-y:auto;margin-top:12px}
.loading{display:none;color:#1a56db;font-size:.85rem;margin-top:8px}
.loading.show{display:block}
.divider{border:none;border-top:2px dashed #e5e7eb;margin:8px 0 20px}
</style>
</head>
<body>
<header>
  <h1>🧾 eNotas — Teste de Inutilização NF-e</h1>
</header>

<div class="container">

  <div class="card">
    <h2>🔑 Credenciais</h2>
    <label>API Key (Base64)</label>
    <div style="display:flex;gap:8px;align-items:flex-start">
      <input type="password" id="apiKey" placeholder="Cole sua API Key aqui..." style="margin-bottom:0">
      <button class="btn btn-secondary" onclick="toggleKey()" style="white-space:nowrap">👁 Ver</button>
    </div>
    <br>
    <label>ID da Empresa (GW)</label>
    <input type="text" id="empresaId" placeholder="Ex: B89E945A-80CB-4091-B54F-3F0250400600">
  </div>

  <div class="card">
    <h2><span class="badge badge-get">GET</span> Consultar Inutilização</h2>
    <label>ID da Inutilização</label>
    <input type="text" id="get_inut_id" placeholder="Ex: inut-13306-_nfe">
    <button class="btn btn-primary" onclick="consultarInutilizacao()">🔍 Consultar</button>
    <div class="loading" id="load_get">⏳ Aguardando resposta...</div>
    <div class="response-box" id="resp_get" style="display:none"></div>
  </div>

  <hr class="divider">

  <div class="card">
    <h2><span class="badge badge-post">POST</span> Inutilizar NF-e</h2>
    <div class="alert">⚠️ Esta ação não pode ser desfeita. Use apenas em caso de quebra na sequência de numeração.</div>
    <div class="grid-2">
      <div><label>ID da Inutilização</label><input type="text" id="post_inut_id" placeholder="Ex: inut-377-_nfe"></div>
      <div><label>Ambiente</label><select id="post_ambiente"><option value="Producao">Produção</option><option value="Homologacao">Homologação</option></select></div>
    </div>
    <div class="grid-2">
      <div><label>Série</label><input type="text" id="post_serie" placeholder="1"></div>
      <div><label>Justificativa</label><input type="text" id="post_just" placeholder="Quebra na sequência da numeração"></div>
    </div>
    <div class="grid-2">
      <div><label>Número Inicial</label><input type="number" id="post_num_ini" placeholder="100"></div>
      <div><label>Número Final</label><input type="number" id="post_num_fim" placeholder="100"></div>
    </div>
    <button class="btn btn-danger" onclick="inutilizar()">⚠️ Inutilizar</button>
    <div class="loading" id="load_post">⏳ Aguardando resposta...</div>
    <div class="response-box" id="resp_post" style="display:none"></div>
  </div>

</div>

<script>
const CORS = 'https://corsproxy.io/?url=';

function toggleKey() {
  const el = document.getElementById('apiKey');
  el.type = el.type === 'password' ? 'text' : 'password';
}
function getKey() {
  const k = document.getElementById('apiKey').value.trim();
  if (!k) { alert('Informe a API Key.'); return null; }
  return k;
}
function getEmpresa() {
  const e = document.getElementById('empresaId').value.trim();
  if (!e) { alert('Informe o ID da Empresa.'); return null; }
  return e;
}
function v(id) { return document.getElementById(id).value.trim(); }
function showLoad(id, on) {
  document.getElementById(id).className = 'loading' + (on ? ' show' : '');
}
function showResp(id, data, status) {
  const el = document.getElementById(id);
  el.style.display = 'block';
  const ok = status >= 200 && status < 300;
  el.innerHTML = `<span style="color:${ok?'#a6e3a1':'#f38ba8'};font-weight:700">HTTP ${status} — ${ok?'✅ Sucesso':'❌ Erro'}</span>\n\n` +
    JSON.stringify(data, null, 2);
}

async function callApi(loadId, respId, url, method, body) {
  const key = getKey(); if (!key) return;
  showLoad(loadId, true);
  document.getElementById(respId).style.display = 'none';
  const opts = {
    method,
    headers: { 'Authorization': 'Basic ' + key, 'Accept': 'application/json' }
  };
  if (body) {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(body);
  }
  try {
    const res  = await fetch(CORS + encodeURIComponent(url), opts);
    const text = await res.text();
    showLoad(loadId, false);
    let data;
    try { data = JSON.parse(text); } catch(e) { data = text; }
    showResp(respId, data, res.status);
  } catch(e) {
    showLoad(loadId, false);
    showResp(respId, { erro: e.message }, 0);
  }
}

function consultarInutilizacao() {
  const emp = getEmpresa(); if (!emp) return;
  const id = v('get_inut_id');
  if (!id) { alert('Informe o ID da Inutilização.'); return; }
  callApi('load_get', 'resp_get',
    `https://api-emissor.enotasgw.com.br/v2/empresas/${emp}/nf-e/inutilizacao/${id}`, 'GET');
}

function inutilizar() {
  const emp = getEmpresa(); if (!emp) return;
  if (!confirm('Confirma a inutilização? Esta ação não pode ser desfeita.')) return;
  const body = {
    id:              v('post_inut_id') || null,
    ambienteEmissao: v('post_ambiente'),
    serie:           v('post_serie') || '1',
    numeroInicial:   parseInt(v('post_num_ini')) || 0,
    numeroFinal:     parseInt(v('post_num_fim')) || 0,
    justificativa:   v('post_just') || null,
  };
  callApi('load_post', 'resp_post',
    `https://api-emissor.enotasgw.com.br/v2/empresas/${emp}/nf-e/inutilizacao`, 'POST', body);
}
</script>
</body>
</html>
